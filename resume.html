<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behruz Nabizoda (Bekha) — resume</title>
<meta name="description" content="Resume of Behruz Nabizoda (Bekha), full-stack developer in Dushanbe.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0f0a03; --fg: #ffb000; --text: #f3d9a4; --dim: #9a7a3c; --line: #3a2a0c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 'IBM Plex Mono', ui-monospace, monospace; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  .bar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
  .bar a, .bar button { font: inherit; color: var(--fg); background: none; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; text-decoration: none; }
  .bar a:hover, .bar button:hover { border-color: var(--fg); }
  .bar button { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
  h1 { font: 56px/1 VT323, monospace; color: var(--fg); margin: 0; letter-spacing: 0.02em; }
  .role { color: var(--fg); margin: 6px 0 16px; }
  .contacts { display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 0; margin: 0 0 24px; list-style: none; }
  .contacts a { color: var(--text); }
  .contacts span { color: var(--dim); margin-right: 6px; }
  h2 { font: 28px/1 VT323, monospace; color: var(--fg); margin: 32px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  h2::before { content: '$ '; color: var(--dim); }
  .proj { margin: 0 0 14px; break-inside: avoid; }
  .proj b { color: var(--fg); font-weight: 600; }
  .proj a { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .proj p { margin: 2px 0 0; }
  .proj small { color: var(--dim); }
  dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; }
  ul.plain { margin: 0; padding-left: 18px; }
  @media (max-width: 560px) { h1 { font-size: 44px; } dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
  @media print {
    @page { margin: 14mm; }
    :root { --bg: #fff; --fg: #000; --text: #111; --dim: #555; --line: #ccc; }
    body { font-size: 10.5pt; }
    main { padding: 0; max-width: none; }
    .bar { display: none; }
    h1 { font-size: 40pt; }
    h2 { margin-top: 18px; }
    a { text-decoration: none; }
  }
</style>
</head>
<body>
<main>
  <div class="bar">
    <a href="./">&lt; back to the terminal</a>
    <button type="button" id="pdf">Download PDF</button>
  </div>
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <ul class="contacts" id="contacts"></ul>
  <p id="summary"></p>
  <h2>projects</h2>
  <div id="projects"></div>
  <h2>skills</h2>
  <dl id="skills"></dl>
  <h2>education</h2>
  <dl id="education"></dl>
  <h2>also</h2>
  <ul class="plain" id="extra"></ul>
</main>
<script src="resume.js?v=2"></script>
<script>
  (() => {
    const R = window.BEKHA_RESUME;
    const $ = (id) => document.getElementById(id);
    const el = (tag, text, attrs) => { const n = document.createElement(tag); if (text) n.textContent = text; Object.assign(n, attrs || {}); return n; };
    $('name').textContent = R.name;
    $('role').textContent = `${R.title} · ${R.location}`;
    R.contacts.forEach(([k, label, href]) => {
      const li = el('li'); li.append(el('span', k), el('a', label, { href, rel: 'noopener' })); $('contacts').appendChild(li);
    });
    $('summary').textContent = R.summary;
    R.projects.forEach(([name, what, stack, url]) => {
      const d = el('div', null, { className: 'proj' });
      d.appendChild(el('b', name));
      if (url) d.appendChild(el('a', url.replace(/^https?:\/\//, '').replace(/\/$/, ''), { href: url, rel: 'noopener' }));
      d.appendChild(el('p', what));
      d.appendChild(el('small', stack));
      $('projects').appendChild(d);
    });
    R.skills.forEach(([k, v]) => $('skills').append(el('dt', k), el('dd', v)));
    R.education.forEach(([where, what]) => $('education').append(el('dt', where), el('dd', what)));
    R.extra.forEach((x) => $('extra').appendChild(el('li', x)));
    $('pdf').addEventListener('click', () => window.print());
  })();
</script>
</body>
</html>
